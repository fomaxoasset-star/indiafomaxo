name: Build Android app

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        env:
          FOMAXO_VERSION_CODE: ${{ github.run_number }}
          FOMAXO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Copy the signing tool (the release APK is signed outside GitHub)
        run: |
          mkdir -p tools
          cp "$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)lib/apksigner.jar" tools/
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner
          path: tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: fomaxo-pos-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
      - name: Keep the unsigned APK on the android-builds branch (signed later with the private FOMAXO key)
        run: |
          mkdir -p out && cp app/build/outputs/apk/release/app-release-unsigned.apk out/ && cp tools/apksigner.jar out/
          echo "${{ github.run_number }} ${{ github.sha }}" > out/BUILD.txt
          cd out
          git init -q -b android-builds
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Android build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-builds
