name: Build Android app

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        env:
          FOMAXO_VERSION_CODE: ${{ github.run_number }}
          FOMAXO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Copy the signing tool (the release APK is signed outside GitHub)
        run: |
          mkdir -p tools
          cp "$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)lib/apksigner.jar" tools/
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner
          path: tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: fomaxo-pos-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
      - name: Keep the unsigned APK on the android-builds branch (signed later with the private FOMAXO key)
        run: |
          mkdir -p out && cp app/build/outputs/apk/release/app-release-unsigned.apk out/ && cp tools/apksigner.jar out/
          echo "${{ github.run_number }} ${{ github.sha }}" > out/BUILD.txt
          cd out
          git init -q -b android-builds
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Android build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-builds

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fomaxo-pos-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Open the app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r "$(find apk -name '*debug*.apk' | head -1)"
            curl -sS -o /dev/null -w 'runner -> pos.fomaxo.in: %{http_code}\n' https://pos.fomaxo.in/ > shots0.txt || true
            adb shell am start -n in.fomaxo.pos/.MainActivity
            sleep 60
            mkdir -p shots && adb exec-out screencap -p > shots/app-open.png
            adb shell am start -n in.fomaxo.pos/.MainActivity --es go sales
            sleep 5
            adb shell pidof in.fomaxo.pos && echo APP_RUNNING
            cat shots0.txt > shots/log.txt || true
            adb shell dumpsys package com.google.android.webview | grep versionName | head -2 >> shots/log.txt || true
            adb logcat -d | grep -E "AndroidRuntime|FATAL|FomaxoPOS|chromium" | tail -80 >> shots/log.txt || true
            adb shell dumpsys appwidget | grep -i fomaxo | head -20 >> shots/log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: shots
      - name: Keep the screenshot on the android-builds branch
        if: always()
        run: |
          git clone -q --depth 1 -b android-builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" b
          cp -r shots b/ || true
          cd b && git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Smoke test ${{ github.run_number }}" && git push -q origin android-builds || true
